<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="360" font-family="serif" fill="#111"><rect width="360" height="640" fill="#faf8f3"/>
<text x="180" y="54" font-size="34" font-weight="900" text-anchor="middle">THE CATCH</text>
<path d="M16 66h328M16 70h328M16 428h328" stroke="#111"/><path d="M180 440v180" stroke="#bbb"/>
<text y="86" font-size="10" fill="#555"><tspan x="16">2026년 4월 20일 월요일</tspan><tspan x="344" text-anchor="end">연예 1면</tspan></text>
<text x="180" y="96" font-size="22" font-weight="900" text-anchor="middle"><tspan x="180" dy="28">[단독] 류재진 대표,</tspan><tspan x="180" dy="28">놀이공원서 포착</tspan></text>
<text x="180" y="176" font-size="12" fill="#555" text-anchor="middle">아이 동반·커트 머리 동행인… "사적인 일정"</text>
<rect x="16" y="190" width="328" height="140" fill="#e4e1da"/><text x="180" y="265" font-size="11" fill="#888" text-anchor="middle">사진 | 독자 제보</text>
<text x="16" y="338" font-size="12" fill="#333"><tspan x="16" dy="18" textLength="328" lengthAdjust="spacing">제이엔터테인먼트 류재진 대표가 지난 주말 오후 서울의 한</tspan><tspan x="16" dy="18" textLength="328" lengthAdjust="spacing">놀이공원에서 목격됐다. 여섯 살가량의 남자아이와 짧은</tspan><tspan x="16" dy="18" textLength="328" lengthAdjust="spacing">커트 머리의 동행인이 함께였다는 목격담이 잇따랐다. 소속사</tspan><tspan x="16" dy="18" textLength="328" lengthAdjust="spacing">측은 "대표의 사적인 일정"이라며 말을 아끼는 분위기다.</tspan></text>
<text x="92" y="438" font-size="14" font-weight="900" text-anchor="middle"><tspan x="92" dy="18">차민석, 차기작</tspan><tspan x="92" dy="18">확정설 솔솔</tspan></text><text x="16" y="480" font-size="11" fill="#444"><tspan x="16" dy="16" textLength="152" lengthAdjust="spacing">업계에 따르면 올 하반기 대작</tspan><tspan x="16" dy="16" textLength="152" lengthAdjust="spacing">영화 출연이 유력한 상황이다.</tspan><tspan x="16" dy="16" textLength="152" lengthAdjust="spacing">소속사는 "검토 중"이라고만</tspan><tspan x="16" dy="16" textLength="152" lengthAdjust="spacing">밝히며 말을 아낀 분위기다.</tspan></text>
<text x="268" y="438" font-size="14" font-weight="900" text-anchor="middle"><tspan x="268" dy="18">이하영, 촬영장</tspan><tspan x="268" dy="18">지각 논란</tspan></text><text x="192" y="480" font-size="11" fill="#444"><tspan x="192" dy="16" textLength="152" lengthAdjust="spacing">소속사 대표가 직접 현장에</tspan><tspan x="192" dy="16" textLength="152" lengthAdjust="spacing">찾아가 고개를 숙였다고 한다.</tspan><tspan x="192" dy="16" textLength="152" lengthAdjust="spacing">하영은 SNS에 반성의 글을</tspan><tspan x="192" dy="16" textLength="152" lengthAdjust="spacing">올려 팬들의 응원을 받았다.</tspan></text>
</svg>